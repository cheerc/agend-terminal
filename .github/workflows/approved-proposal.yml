name: Approved-by

# Verifies that every commit which ADDS or MODIFIES a foldable document
# (`docs/PROPOSAL-*.md` / `docs/SPEC-*.md`) carries an `Approved-by: cheerc`
# trailer. Other commits are unaffected.
#
# The gate lives here rather than in a Rust integration test because a trailer
# is commit metadata: a test reading the working tree cannot see which commits
# touched a path, and a test reading git objects is a shell job wearing a test's
# name. `.github/workflows/dco.yml` already does exactly this for
# `Signed-off-by` over the same `gh api` calls, so this is the same mechanism
# applied to a second trailer — no new trust boundary, and no way to pass it by
# editing the document itself.
#
# Editing an APPROVED document to sneak past the gate fails the same way: the
# modification commit still needs its own `Approved-by: cheerc`.
#
# A local test COULD enforce a weaker, different thing: that the document
# declares its own approval inline (an `<!-- approved-by: cheerc -->` marker).
# That is deliberately NOT done — see CONTRIBUTING.md for why a marker a committer
# writes into the same file is not owner approval.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: approved-by-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approved-by:
    name: Approved-by cheerc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Approved-by on commits touching foldable documents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Which commits touch a foldable document. The commits endpoint does
          # not carry per-commit file lists, so build the set from the PR files
          # endpoint (each row names its commit `sha`).
          touching="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" \
            | jq -r '.[] | select(.filename | test("^docs/(PROPOSAL|SPEC)-[^/]+\\.md$")) | .sha' \
            | sort -u)"

          if [ -z "$touching" ]; then
            echo "No commit touches a foldable document; nothing to approve."
            exit 0
          fi

          offenders="$(gh api --paginate "repos/${REPO}/pulls/${PR}/commits" \
            | jq -r --argjson touching "$(printf '%s' "$touching" | jq -R . | jq -s .)" '
              .[]
              | . as $c
              | select(($c.parents | length) < 2)
              | select((($c.commit.author.email // "") | test("\\[bot\\]")) | not)
              | select($touching | index($c.sha))
              | select(($c.commit.message | test("(?im)^[ \\t]*Approved-by:[ \\t]+cheerc[ \\t]*$")) | not)
              | ($c.commit.message | split("\n")[0]) as $subject
              | "  - \($c.sha[0:12])  \($subject)"
            ')"

          if [ -n "$offenders" ]; then
            echo "::error::A commit touching docs/PROPOSAL-*.md or docs/SPEC-*.md is missing 'Approved-by: cheerc'."
            echo "Commits touching those paths without approval:"
            printf '%s\n' "$offenders"
            echo ""
            echo "Those documents are exempt from the bilingual-pair and index rules"
            echo "because they are point-in-time and folded away, not maintained."
            echo "Owner approval is a commit-level fact, so it is checked at the commit level."
            echo "Fix it:"
            echo "  - amend the last:  git commit --amend -s --trailer 'Approved-by: cheerc' --no-edit"
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi

          echo "Every commit touching a foldable document carries 'Approved-by: cheerc'. ✓"
